<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Packaging as an Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Inter:wght@400;500&display=swap">
<style>
/* Minimal product-design portfolio: near-white paper, one sans family, hairline rules instead of boxes, images on a quiet warm-grey stage */
:root{
  --paper:#fbfaf8; --panel:#fbfaf8; --ink:#141414; --muted:#6b6b6b; --faint:#9a9a9a; --line:#e3e1dc; --stage:#eae5df; --white:#ffffff;
  --display:"Inter Tight","Helvetica Neue",Arial,sans-serif; --body:"Inter","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#121212; --panel:#121212; --ink:#ededeb; --muted:#a3a3a0; --faint:#77777a; --line:#2c2c2c; color-scheme:dark } }
:root[data-theme="dark"]{ --paper:#121212; --panel:#121212; --ink:#ededeb; --muted:#a3a3a0; --faint:#77777a; --line:#2c2c2c; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:-.02em}
.label,.tier,.pill,.eyebrow,.split-label,.stage .count{font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* header */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:none;margin:0;padding:14px 48px;display:flex;align-items:center;gap:12px 32px;flex-wrap:wrap}
.who{font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:-.01em;margin-right:auto;background:none;border:0;padding:0;cursor:pointer}
.who span{color:var(--faint);font-weight:400}
.nav{position:relative;display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:4px 0;font-size:13px;font-weight:400;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;gap:6px;border-bottom:1px solid transparent}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.nav i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--faint)}
.wrap{max-width:1200px;margin:0 auto;padding:56px 24px 72px}
.wrap.wide{max-width:none;margin:0;padding:56px 48px 72px}

/* overview */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px 48px;align-items:end;padding-bottom:40px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(38px,6vw,76px);line-height:.98;letter-spacing:-.04em;margin:14px 0 0;text-wrap:balance}
.hero p{margin:0 0 .5em;color:var(--muted);max-width:none;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px 32px;margin-top:44px}
@media (min-width:861px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}.grid>.card{grid-column:span 2}.grid>.card:nth-last-child(2):nth-child(3n+1){grid-column:2/4}.grid>.card:last-child:nth-child(3n+2){grid-column:4/6}}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .thumb{aspect-ratio:1;background:var(--stage);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.card .thumb img{width:100%;height:100%;object-fit:cover;background:var(--white);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .thumb img{transform:scale(1.025)}
.card .ph{font-family:var(--display);font-weight:400;font-size:56px;color:var(--faint)}
.tier{display:flex;gap:10px}
.tier b{display:none}
.card h2{font-size:22px;line-height:1.15;margin:0}
.card p{margin:0;color:var(--muted);font-size:14px;max-width:42ch}
.split-label{grid-column:1/-1;margin:0 0 -24px;padding-top:4px;display:flex;justify-content:space-between}
.split-label + .card, .split-label ~ .card{}
.grid .split-label:not(:first-child){margin-top:24px;padding-top:28px;border-top:1px solid var(--line)}

/* concept header */
.chead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 40px;margin-bottom:40px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.chead h1{font-size:clamp(34px,5vw,60px);line-height:1;letter-spacing:-.035em;margin:12px 0 12px;text-wrap:balance}
.chead p{margin:0;max-width:56ch;color:var(--muted);font-size:16px}
.pill{display:inline-block;background:none;padding:0}
.clogo{display:block;height:34px;width:auto;max-width:100%;margin:0 0 4px}
.tabs{display:flex;gap:24px}
.tabs button{border:0;background:none;padding:6px 0;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:1px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* walkthrough player */
.player{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:stretch}
.stage{position:relative;background:var(--stage);overflow:hidden;aspect-ratio:1;max-width:100%}
.stage canvas{width:100%;height:100%;display:block}
.stage .count{position:absolute;left:16px;top:14px;color:#6b665e}
.stage .load{position:absolute;right:16px;bottom:14px;font-size:12px;color:#6b665e}
.talk{display:flex;flex-direction:column;gap:20px;min-width:0}
.steps{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.step{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:start;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:16px 0;cursor:pointer}
.step .n{font-family:var(--body);font-size:12px;font-variant-numeric:tabular-nums;color:var(--faint);padding-top:5px}
.step h3{margin:0;font-size:19px;font-weight:500;color:var(--muted);transition:color .2s}
.step p{margin:8px 0 0;color:var(--muted);font-size:14.5px;display:none;max-width:52ch}
.step:hover h3{color:var(--ink)}
.step[aria-current="true"] h3{color:var(--ink)}
.step[aria-current="true"] .n{color:var(--ink)}
.step[aria-current="true"] p{display:block}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.ctrl button{border:1px solid var(--line);background:none;border-radius:0;padding:10px 18px;font-size:13px;cursor:pointer;min-height:44px}
.ctrl button:hover{border-color:var(--ink)}
.ctrl button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.states{margin:0 0 14px}.states button{flex:1}.states button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.rot{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted)}
.rot input{flex:1;accent-color:var(--ink);min-height:32px}

/* other options */
.opts{display:grid;gap:0;border-top:1px solid var(--line)}
.opt{border-bottom:1px solid var(--line);padding:36px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:40px;min-width:0}
.opt h2{font-size:26px;margin:0 0 10px}
.opt > div > p{color:var(--muted);margin:0}
.opt .kv{display:grid;gap:14px;margin-top:20px}
.opt .kv div{border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.opt .kv b{display:block;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.opt.full{grid-template-columns:minmax(0,1fr)}
.pics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pics figure,.renders figure,.or4 figure{margin:0}
.pics img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--stage);display:block}
figcaption{font-size:12px;color:var(--muted);margin-top:8px}
.opt .wide{margin:0}.opt .wide img{width:100%;display:block;background:var(--stage)}

/* concept content */
.hero2 .brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero2 .logo{border:1px solid var(--line);font-family:var(--display);font-weight:500;font-size:13px;padding:3px 10px}
.hero2 h1{margin:14px 0 8px}
.hero2 .sub{font-family:var(--display);font-weight:400;font-size:clamp(19px,2.2vw,24px);color:var(--ink);margin:0 0 10px;letter-spacing:-.01em}
.hero2 .note,.orhead .note{display:inline-block;margin-top:14px;font-size:12px;color:var(--faint)}
.purpose{border-top:1px solid var(--line);padding:40px 0 0;margin:0 0 48px;display:grid;gap:22px}
.purpose h2{font-size:clamp(24px,3vw,34px);line-height:1.1;margin:0;max-width:24ch}
.purpose .lead{margin:0;font-size:16px;max-width:64ch;color:var(--muted)}
.purpose .points{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.purpose .points div{padding-top:12px;border-top:1px solid var(--ink);display:flex;flex-direction:column;gap:6px;min-width:0}
.purpose .points b{font-family:var(--display);font-weight:500;font-size:17px}
.purpose .points span{color:var(--muted);font-size:14px}
.purpose.bottom{margin:64px 0 0}
.flap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:center}
.flap img{width:100%;display:block;background:var(--stage)}
.flap h3{font-size:19px;margin:0 0 8px}
.flap p{margin:0;color:var(--muted);font-size:14px}
.walkh{font-size:clamp(24px,3vw,34px);margin:8px 0 24px}
.walknote{color:var(--faint);font-size:12px;margin:16px 0 0;max-width:70ch}
.renders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:40px}
.renders img{width:100%;aspect-ratio:1.1;object-fit:cover;display:block;background:var(--stage)}
.renders.four img{object-fit:contain;background:var(--white)}
@media (min-width:861px){.renders.four{grid-template-columns:repeat(4,minmax(0,1fr))}.renders.four img{aspect-ratio:1}}
.empty{border-top:1px solid var(--line);padding:40px 0 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:40px;align-items:center}
.empty .big{aspect-ratio:1;background:var(--stage);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:300;font-size:120px;color:#b9b2a8}
.empty h2{font-size:26px;margin:0 0 10px}
.empty p{margin:0 0 12px;color:var(--muted)}
.empty .pill{color:var(--faint)}
.foot{margin-top:72px;color:var(--faint);font-size:12px;border-top:1px solid var(--line);padding-top:18px}

/* Open Road */
.orhero{margin:0 0 40px}
.orhero img{width:100%;max-height:min(78vh,820px);object-fit:contain;display:block;background:var(--white)}
.orhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 48px;align-items:end;padding-bottom:40px;border-bottom:1px solid var(--line);margin-bottom:48px}
.orhead > *{grid-column:1}
.orhead .why{grid-column:2}
.orhead .eyebrow{grid-row:1}
.orhead h1{font-size:clamp(38px,5.6vw,68px);line-height:1;letter-spacing:-.04em;margin:0}
.orhead .sub{font-family:var(--display);font-weight:400;font-size:clamp(18px,2vw,22px);margin:0;letter-spacing:-.01em;max-width:36ch}
.orhead .why{margin:0;color:var(--muted);font-size:15px;max-width:52ch;grid-row:1 / span 3;align-self:end}
.orhead .row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.cta{display:inline-flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--ink);padding:0 0 4px;font-size:14px;font-weight:500}
.cta small{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.orhead .walkh{margin-top:0}
.lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.lists h3{font-size:17px;margin:0 0 8px;padding-top:12px;border-top:1px solid var(--ink)}
.lists ul{margin:0;padding-left:16px;color:var(--muted);font-size:14px}
.lists li{margin:4px 0}
.purpose .small{margin:0;color:var(--faint);font-size:12px}
.or4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.or4.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.or4 img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:var(--white)}
.widefig{margin:0}.widefig img{width:100%;display:block;background:var(--stage)}.widefig figcaption{font-size:12px;color:var(--muted);margin-top:8px}
.stagebg img,.orhero.stagebg img{background:var(--stage)!important}
.credit{font-size:12px;color:var(--faint);margin:28px 0 0;max-width:90ch}

@media (max-width:860px){
  .wrap.wide{padding:36px 16px 56px}
  .player,.opt,.empty,.hero,.orhead,.flap{grid-template-columns:1fr}
  .orhead .why{grid-column:1;grid-row:auto}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .purpose .points{grid-template-columns:1fr}
  .wrap{padding:36px 16px 56px}.bar-in{padding:12px 16px}
}
@media (max-width:620px){.or4{grid-template-columns:repeat(2,minmax(0,1fr))}.or4.n3{grid-template-columns:1fr}.lists{grid-template-columns:1fr}}
@media (max-width:520px){.grid{grid-template-columns:1fr;gap:40px}.renders{grid-template-columns:1fr}.who span{display:none}}
@media (prefers-reduced-motion:reduce){.card .thumb img{transition:none}}
</style>

<header class="bar"><div class="bar-in">
  <button class="who" id="home">Oliver Branson Hammond <span>· Packaging as an experience</span></button>
  <nav class="nav" id="nav" aria-label="Concepts"></nav>
</div></header>
<main class="wrap" id="main"></main>

<script>
const SEQ = {q1:36,q2:41,q3:24,q4:30,a1:40,a2:46,a3:32,a4:48,a5:56,p1:36,p2:46,p3:30};
const C = [
 {id:1, tier:'lead', c:'#d6402c', name:'A Little Extra', partner:'Domino’s', client:'Domino’s', logoImg:'f/logo_dominos.png',
  line:'Domino’s adds one free extra slice to the box, in its own triangular carton that rises into view as the lid opens. A partner brand pays to put its name on the carton, for example “adidas × Domino’s”.',
  purposeBottom:true,
  purpose:{title:'A free slice, paid for by a partner.',
    copy:'Domino’s gives customers a little extra: one free slice in its own carton. The carton and the inside of its lid are sponsor space, so a partner brand reaches people at the moment the box opens, and the free slice gives customers a reason to order again.',
    points:[['Customers get a little extra','One free slice in a large pizza box, kept separate and level in its own carton.'],
            ['Partners buy the carton','The carton top and the inside of its lid carry joint branding such as “adidas × Domino’s”.'],
            ['A next step for the partner','A QR code inside the carton lid can link to the partner’s campaign page. It’s a placeholder here, with no offer invented.']]},
  thumb:'f/r_closed.jpg',
  renders:[['f/r_closed.jpg','Closed: the red corner is the only clue'],['f/r_open.jpg','Open: the slice carton sits level on the lid']],
  walk:[
   {seq:'a1', loop:true, t:'Arrives closed', b:'A standard large Domino’s box. The red triangle in the back corner is the only clue: the free slice sits in its own carton, raised just above the crust so it can be a full size slice.'},
   {seq:'a2', t:'Open the lid', b:'A folded card link under the lid turns a single arm. The carton rises out of the corner and swings over the hinge, staying level the whole way, never touching the pizza.'},
   {seq:'a3', t:'Open the slice', b:'The carton lands level on the open lid. Flip its lid: a full 1/8 slice of the same pizza, and the inside of the lid carries the sponsor’s message and a QR placeholder.'},
   {seq:'a4', t:'Remove the stand, tear off the lid', b:'After the meal, lift out the empty carton and its arm. Tear the lid off along the perforated hinge and press out the panel printed on its inside.'},
   {seq:'a5', t:'Fold a box for leftovers', b:'Fold up the three walls, put the last three slices in, then fold the top over and tuck its flaps in. The result is a box shaped like a slice, 182 mm long and 55 mm deep, ready for the fridge.'}],
  opts:[
   {t:'Pull out tray', b:'A matchbox sleeve. Pull the red tab and the whole pizza slides out on its tray, with the free extra slice waiting in the front corner.',
    pro:'No linkage or pins. Stacks flat like a normal box. Cheapest to produce.', con:'No pop up moment. Needs a stiffer tray and a sleeve instead of a hinged lid.',
    walk:[
     {seq:'p1', loop:true, t:'Sleeve and tab', b:'Printed sleeve, red pull tab on the front face.'},
     {seq:'p2', t:'Pull', b:'The tray slides out about 290 mm. The tray and sleeve have 0.5 mm running clearance.'},
     {seq:'p3', t:'Slice revealed', b:'The free slice carton sits in the front left corner, 4.6 mm clear of the crust.'}]},
   {t:'Pop up, open pivot', b:'The same lift with the pivot left exposed. This is where the mechanism was first resolved.',
    pro:'Proved the lift works through the full 180°: every part checked at 2° steps.', con:'The pivot stands about 22 mm proud of the lid, which looks unfinished. The hood in the lead version fixes this.',
    pics:[['f/x_a1_closed.jpg','Closed: exposed pivot'],['f/x_a1_mid.jpg','Lid at 90°']]},
   {t:'Side drawer', b:'Only the slice comes out: a red tab in the side wall slides a triangular tray out of the box without opening it.',
    pro:'Five card parts. Box stays a normal box.', con:'Slot weakens the side wall and can let heat out. Easy to miss the tab.',
    pics:[['f/x_b_closed.jpg','Closed: tab in the side wall'],['f/x_b_out.jpg','Slice pulled out']]}]},
 {id:2, tier:'lead', c:'#e60000', name:'A Fresh Start', partner:'Vodafone',
  line:'A proposed Vodafone student welcome kit that unfolds into three reusable room boxes, helping students settle in and discover their connectivity options.',
  thumb:'f/v2_closed.jpg',
  hero:{logo:'Vodafone', logoImg:'f/vodafone_logo.png', eyebrow:'VODAFONE · STUDENT MOVE IN CAMPAIGN', sub:'Move in. Unpack. Get connected.',
    intro:'A proposed Vodafone sponsored welcome kit that helps students settle into their new space. One compact package opens into three detachable storage boxes for the bedroom, bathroom and desk.',
    note:'Independent concept proposal for Vodafone.'},
  purposeBottom:true,
  purpose:{title:'A useful welcome. A reason to connect.',
    copy:'Starting university means setting up a new room and finding your feet. A Fresh Start gives Vodafone a practical role in that moment: helping students organise their essentials while introducing its student connectivity offer.',
    points:[['Reach students at move in','Proposed distribution through university welcome events and participating student accommodation providers.'],
            ['Give them something worth keeping','Three reusable boxes help organise everyday essentials after unpacking.'],
            ['Create a next step','An inside welcome panel introduces the proposed Vodafone offer through a campaign QR link.']]},
  flap:{img:'f/v2_flap_render.jpg', t:'Campaign touchpoint: inside the bedroom lid', b:'“Your fresh start begins here. Explore student connectivity.” The QR code is a labelled placeholder for a future Vodafone campaign page. It sits on the flat lid panel, clear of folds and seams. No offer, price or coverage claim is made.'},
  walkTitle:'One box. Three spaces.',

  renders:[['f/v2_closed.jpg','1 · Closed: one red cube, about 304 × 307 × 300 mm'],['f/v2_half.jpg','2 · Half open: the side boxes swing out on the wrap'],

  walk:[
   {seq:'q1', loop:true, t:'Arrive with one compact kit.', b:'About 304 × 307 × 300 mm. A red outer wrap holds three room boxes: the bedroom box at the back, bathroom and desk side by side in front. A tongue on the right door tucks into a slit in the left door.'},
   {seq:'q2', t:'Swing the side boxes open.', b:'Pull the tongue free. Each front box rides on a door of the wrap and turns 180° about a fold at the bedroom box’s front corner. The boxes stay upright on the floor the whole way and land beside the bedroom box, labels facing forward.'},
   {seq:'q3', t:'Lift the lids and unpack.', b:'Each box has its own tuck lid, so students can unpack one room at a time. Inside the bedroom lid, a welcome panel points to the campaign page.'},
   {seq:'q4', t:'Separate the boxes for your room.', b:'Lift the retaining tabs and slide each box forward out of the wrap. Each box keeps its room label and a small Vodafone mark. The wrap folds flat.'}],
  opts:[
   {t:'Hinge geometry', b:'I worked the layout out in plan with simple volumes before any detail. Each door turns 180° about a vertical crease at the bedroom box’s front corner.',
    pro:'Boxes end up flush with the bedroom box front and never collide: smallest gap 1 mm between boxes while swinging. The right door opens first because it carries the tuck tongue.',
    con:'Side boxes widened from 145 to 148 mm so the pair fills the 300 mm front with 2 mm between them. The closed package comes out 304 × 307 × 300 mm, inside the 320 mm target.',

   {t:'Wrap construction', b:'One die cut strip of board, red printed outside and kraft inside, with no glue joins. Room boxes are standard tuck top cartons.',

    wide:['f/v_diag_wrap.jpg','Wrap dieline: 1218 × 300 mm strip']},
   {t:'Size up: a move in version', b:'The welcome kit stays the main campaign: small enough to hand out at welcome events and carry home. The same design scaled up 1.5× becomes a box students can actually move their things in, offered as an upgrade alongside it.',
    pro:'Same wrap, same hinge layout and the same three room boxes, so it is one design in two sizes. At about 456 × 460 × 450 mm closed, each side box is 222 mm wide, so A4 folders fit upright in the desk box.',

/* ---------- frame player ---------- */
const cache = {};
function frameSrc(seq,i){ return `f/${seq}_${String(i).padStart(3,'0')}.jpg`; }
function preload(seq){ if(cache[seq]) return cache[seq];
  const n=SEQ[seq], imgs=[]; let done=0;
  const p = new Promise(res=>{ for(let i=0;i<n;i++){ const im=new Image(); im.onload=im.onerror=()=>{ if(++done===n) res(imgs); }; im.src=frameSrc(seq,i); imgs.push(im);} });
  cache[seq]={imgs,ready:p}; return cache[seq]; }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let activeRaf = 0;
function mountPlayer(el, steps, color){
  el.innerHTML = `<div class="player">
    <div class="stage"><canvas width="960" height="960" aria-label="Animated render"></canvas><span class="count"></span><span class="load"></span></div>
    <div class="talk"><div class="steps">${steps.map((s,i)=>`<button class="step" data-i="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span><span><h3>${s.t}</h3><p>${s.b}</p></span></button>`).join('')}</div>
    <div class="ctrl"><button data-a="prev">← Back</button><button class="primary" data-a="next">Next step →</button><button data-a="replay">Replay</button></div></div></div>`;
  const cv = el.querySelector('canvas'), g = cv.getContext('2d'), count = el.querySelector('.count'), load = el.querySelector('.load');
  let cur = 0, f = 0, dir = 1, last = 0, imgs = null;
  steps.forEach(s=>preload(s.seq));
  function draw(){ if(imgs && imgs[f] && imgs[f].complete) g.drawImage(imgs[f],0,0,cv.width,cv.height); }
  function go(i){ cur = Math.max(0, Math.min(steps.length-1, i)); f = 0; dir = 1; imgs = null;
    el.querySelectorAll('.step').forEach((b,j)=>b.setAttribute('aria-current', j===cur));
    count.textContent = `Step ${cur+1} of ${steps.length}`;
    const c = cache[steps[cur].seq]; load.textContent = 'Loading…';
    c.ready.then(a=>{ if(steps[cur].seq!==undefined && cache[steps[cur].seq]===c){ imgs=a; load.textContent=''; if(reduce){ f=a.length-1; } draw(); } });
    el.querySelector('[data-a="next"]').textContent = cur===steps.length-1 ? 'Back to start' : 'Next step →';
  }
  el.querySelectorAll('.step').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  el.querySelector('[data-a="prev"]').onclick=()=>go(cur-1);
  el.querySelector('[data-a="next"]').onclick=()=>go(cur===steps.length-1?0:cur+1);
  el.querySelector('[data-a="replay"]').onclick=()=>go(cur);
  function tick(t){
    if(!el.isConnected) return;
    if(imgs && !reduce && t-last > 42){ last=t; const n=imgs.length, s=steps[cur];
      if(s.loop){ f+=dir; if(f>=n-1||f<=0) dir=-dir; } else if(f<n-1) f++;
      draw(); }
    requestAnimationFrame(tick);
  }
  go(0); requestAnimationFrame(tick);
  el.tabIndex = -1;
  return {go:(i)=>go(i), next:()=>go(cur===steps.length-1?0:cur+1), prev:()=>go(cur-1)};
}

    body.querySelectorAll('.optplayer').forEach(d=>{ player = mountPlayer(d, c.opts[+d.dataset.i].walk, c.c); });
  } else {
    if(c.purpose){ const pu=document.createElement('section'); pu.className='purpose';
      pu.innerHTML=`<h2>${c.purpose.title}</h2><p class="lead">${c.purpose.copy}</p><div class="points">${c.purpose.points.map(p=>`<div><b>${p[0]}</b><span>${p[1]}</span></div>`).join('')}</div>`+
        (c.flap?`<div class="flap"><img src="${c.flap.img}" alt="Proposed welcome panel inside the bedroom box lid with a QR placeholder"><div><h3>${c.flap.t}</h3><p>${c.flap.b}</p></div></div>`:'');
      if(c.purposeBottom) pu.classList.add('bottom'); body.append(pu); }
    if(c.walkTitle){ const h=document.createElement('h2'); h.className='walkh'; h.textContent=c.walkTitle; body.append(h); }
    if(c.renders){ const r=document.createElement('div'); r.className='renders'+(c.renders.length>2?' four':''); r.innerHTML=c.renders.map(p=>`<figure><img src="${p[0]}" alt="${p[1]}"><figcaption>${p[1]}</figcaption></figure>`).join(''); const pw=document.createElement('div'); body.append(r,pw); player = mountPlayer(pw, c.walk, c.c);
      if(c.walkNote){ const n=document.createElement('p'); n.className='walknote'; n.textContent=c.walkNote; body.append(n); }
      const pb=body.querySelector('.purpose.bottom'); if(pb) body.append(pb); }
    else player = mountPlayer(body, c.walk, c.c);
  }
}
function setHash(h){ try { history.replaceState(null,'',h); } catch(e){} }
function route(k){
  renderNav(k);
  if(k==='home'){ home(); setHash('#overview'); }
  else { concept(C.find(c=>c.id===k),'walk'); setHash('#c'+k); }
  try { scrollTo({top:0}); } catch(e){}
}
document.getElementById('home').onclick=()=>route('home');
addEventListener('keydown',e=>{ if(!player || e.target.closest('input,textarea')) return;
  if(e.key==='ArrowRight'){ player.next(); e.preventDefault(); } if(e.key==='ArrowLeft'){ player.prev(); e.preventDefault(); } });
let h=null; try { h = (location.hash||'').match(/^#c([1-5])$/); } catch(e){}
route(h? +h[1] : 'home');
</script>
